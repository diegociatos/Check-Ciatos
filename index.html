
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checklist Diário - Grupo Ciatos</title>
    <style>
      /* Fontes: corpo (Inter) e títulos (Book Antiqua) são definidos no
         index.css / tailwind.config.js. Aqui ficam só ajustes globais. */
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      /* Custom scrollbar for better aesthetics */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #faf7f2;
      }
      ::-webkit-scrollbar-thumb {
        background: #d6ccbf;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #8B1B1F;
      }
      .login-card-shadow {
        box-shadow: 0 10px 30px rgba(107, 61, 30, 0.10);
      }
    </style>
</head>
  <body class="bg-fundo text-tinta">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
