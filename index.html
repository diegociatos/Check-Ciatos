
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checklist Diário - Grupo Ciatos</title>
    <style>
      /* Tipografia de marca Grupo Ciatos: Book Antiqua (serifa editorial).
         Pilha com equivalentes para quem não tem a fonte local (Mac/celular). */
      body, button, input, select, textarea, h1, h2, h3, h4, h5, h6 {
        font-family: 'Book Antiqua', 'Palatino Linotype', 'Palatino', 'URW Palladio L', 'Georgia', serif !important;
      }

      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      .font-ciatos {
        font-family: 'Book Antiqua', 'Palatino Linotype', 'Palatino', 'URW Palladio L', 'Georgia', serif;
      }

      /* Custom scrollbar for better aesthetics */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #8B1B1F;
        border-radius: 10px;
      }
      .login-card-shadow {
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      }
    </style>
</head>
  <body class="bg-[#F3F3F3] text-[#111111]">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
